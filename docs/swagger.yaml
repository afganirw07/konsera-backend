definitions:
  dto.CreateUserPreferenceRequest:
    properties:
      created_at:
        type: string
      favorite_genres:
        items:
          type: string
        type: array
      marketing_opt_in:
        type: boolean
      notify_email:
        type: boolean
      notify_push:
        type: boolean
      notify_sms:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
    required:
    - favorite_genres
    - user_id
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - email
    - full_name
    - password
    - phone
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.ResendOTPRequest:
    properties:
      profile_id:
        type: string
    required:
    - profile_id
    type: object
  dto.UserPreferenceResponse:
    properties:
      created_at:
        type: string
      favorite_genres:
        items:
          type: string
        type: array
      marketing_opt_in:
        type: boolean
      notify_email:
        type: boolean
      notify_push:
        type: boolean
      notify_sms:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.UserResponse:
    properties:
      auth_provider:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      profile_id:
        type: string
      provider_uid:
        type: string
      status:
        type: string
    type: object
  dto.VerifyOTPRequest:
    properties:
      code:
        type: integer
      profile_id:
        type: string
    required:
    - code
    - profile_id
    type: object
  event.CreateArtistRequest:
    properties:
      bio:
        type: string
      name:
        maxLength: 150
        type: string
      photo_url:
        type: string
    required:
    - name
    type: object
  event.CreateCategoryRequest:
    properties:
      icon_url:
        type: string
      name:
        maxLength: 100
        type: string
      slug:
        maxLength: 120
        type: string
    required:
    - name
    - slug
    type: object
  event.CreateEventRequest:
    properties:
      banner_url:
        type: string
      category_ids:
        items:
          type: string
        type: array
      description:
        type: string
      organizer_id:
        type: string
      poster_url:
        type: string
      refund_policy:
        type: string
      slug:
        maxLength: 280
        type: string
      terms_and_conditions:
        type: string
      title:
        maxLength: 250
        type: string
      venue_id:
        type: string
    required:
    - organizer_id
    - slug
    - title
    - venue_id
    type: object
  event.CreateSessionRequest:
    properties:
      end_at:
        type: string
      gate_close_at:
        type: string
      gate_open_at:
        type: string
      session_name:
        type: string
      start_at:
        type: string
      status:
        type: string
    required:
    - end_at
    - gate_close_at
    - gate_open_at
    - start_at
    type: object
  event.UpdateCategoryRequest:
    properties:
      icon_url:
        type: string
      name:
        maxLength: 100
        type: string
      slug:
        maxLength: 120
        type: string
    type: object
  event.UpdateEventRequest:
    properties:
      banner_url:
        type: string
      category_ids:
        items:
          type: string
        type: array
      description:
        type: string
      is_featured:
        type: boolean
      organizer_id:
        type: string
      poster_url:
        type: string
      refund_policy:
        type: string
      rejection_reason:
        type: string
      slug:
        maxLength: 280
        type: string
      status:
        type: string
      terms_and_conditions:
        type: string
      title:
        maxLength: 250
        type: string
      venue_id:
        type: string
    type: object
  helpers.APIResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  models.Artist:
    properties:
      bio:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      photo_url:
        type: string
    type: object
  models.Event:
    properties:
      approved_at:
        type: string
      approved_by:
        type: string
      banner_url:
        type: string
      category_ids:
        items:
          type: string
        type: array
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_featured:
        type: boolean
      max_price:
        type: number
      min_price:
        type: number
      organizer_id:
        type: string
      poster_url:
        type: string
      refund_policy:
        type: string
      rejection_reason:
        type: string
      slug:
        type: string
      status:
        type: string
      terms_and_conditions:
        type: string
      title:
        type: string
      updated_at:
        type: string
      venue_id:
        type: string
    type: object
  models.EventCategory:
    properties:
      icon_url:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  models.EventSession:
    properties:
      created_at:
        type: string
      end_at:
        type: string
      event_id:
        type: string
      gate_close_at:
        type: string
      gate_open_at:
        type: string
      id:
        type: string
      session_name:
        type: string
      start_at:
        type: string
      status:
        type: string
    type: object
  models.Organizer:
    properties:
      bank_account_name:
        type: string
      bank_account_number:
        type: string
      bank_name:
        type: string
      commission_rate_override:
        type: number
      company_name:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      legal_entity_type:
        type: string
      tax_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      verification_status:
        type: string
    type: object
  models.OrganizerVerification:
    properties:
      created_at:
        type: string
      document_type:
        type: string
      document_url:
        type: string
      id:
        type: string
      organizer_id:
        type: string
      rejection_reason:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      status:
        type: string
    type: object
  models.Seat:
    properties:
      coord_x:
        type: number
      coord_y:
        type: number
      created_at:
        type: string
      id:
        type: string
      row_label:
        type: string
      seat_number:
        type: string
      venue_section_id:
        type: string
    type: object
  models.TicketInventory:
    properties:
      event_session_id:
        type: string
      held_count:
        type: integer
      id:
        type: string
      sold_count:
        type: integer
      ticket_tier_id:
        type: string
      total_quota:
        type: integer
      updated_at:
        type: string
      version:
        type: integer
    type: object
  models.TicketTier:
    properties:
      created_at:
        type: string
      event_id:
        type: string
      id:
        type: string
      is_seated:
        type: boolean
      max_per_transaction:
        type: integer
      name:
        type: string
      price:
        type: number
      sale_end_at:
        type: string
      sale_start_at:
        type: string
      tier_type:
        type: string
      updated_at:
        type: string
      venue_section_id:
        type: string
    type: object
  models.Venue:
    properties:
      address:
        type: string
      city:
        type: string
      country:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      province:
        type: string
      total_capacity:
        type: integer
      type:
        type: string
      updated_at:
        type: string
    type: object
  models.VenueSection:
    properties:
      capacity:
        type: integer
      created_at:
        type: string
      id:
        type: string
      is_seated:
        type: boolean
      name:
        type: string
      venue_id:
        type: string
    type: object
  organizer.CreateOrganizerRequest:
    properties:
      bank_account_name:
        type: string
      bank_account_number:
        type: string
      bank_name:
        type: string
      commission_rate_override:
        maximum: 100
        minimum: 0
        type: number
      company_name:
        maxLength: 200
        type: string
      legal_entity_type:
        type: string
      tax_id:
        type: string
      user_id:
        type: string
    required:
    - company_name
    - user_id
    type: object
  organizer.CreateOrganizerVerificationRequest:
    properties:
      document_type:
        maxLength: 50
        type: string
      document_url:
        type: string
    required:
    - document_type
    - document_url
    type: object
  organizer.UpdateOrganizerRequest:
    properties:
      bank_account_name:
        type: string
      bank_account_number:
        type: string
      bank_name:
        type: string
      commission_rate_override:
        maximum: 100
        minimum: 0
        type: number
      company_name:
        maxLength: 200
        type: string
      legal_entity_type:
        type: string
      tax_id:
        type: string
      verification_status:
        enum:
        - pending
        - in_review
        - approved
        - rejected
        type: string
    type: object
  organizer.UpdateOrganizerVerificationRequest:
    properties:
      document_type:
        maxLength: 50
        type: string
      document_url:
        type: string
      rejection_reason:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: string
      status:
        enum:
        - pending
        - in_review
        - approved
        - rejected
        type: string
    type: object
  ticket.CreateInventoryRequest:
    properties:
      event_session_id:
        type: string
      total_quota:
        minimum: 0
        type: integer
    required:
    - event_session_id
    type: object
  ticket.CreateTicketTierRequest:
    properties:
      is_seated:
        type: boolean
      max_per_transaction:
        type: integer
      name:
        maxLength: 100
        type: string
      price:
        minimum: 0
        type: number
      sale_end_at:
        type: string
      sale_start_at:
        type: string
      tier_type:
        enum:
        - early_bird
        - regular
        - vip
        - vvip
        - group_package
        type: string
      venue_section_id:
        type: string
    required:
    - name
    - tier_type
    type: object
  ticket.UpdateTicketTierRequest:
    properties:
      is_seated:
        type: boolean
      max_per_transaction:
        type: integer
      name:
        maxLength: 100
        type: string
      price:
        minimum: 0
        type: number
      sale_end_at:
        type: string
      sale_start_at:
        type: string
      tier_type:
        enum:
        - early_bird
        - regular
        - vip
        - vvip
        - group_package
        type: string
      venue_section_id:
        type: string
    type: object
  venue.CreateSeatRequest:
    properties:
      coord_x:
        type: number
      coord_y:
        type: number
      row_label:
        maxLength: 10
        type: string
      seat_number:
        maxLength: 10
        type: string
    required:
    - row_label
    - seat_number
    type: object
  venue.CreateVenueRequest:
    properties:
      address:
        type: string
      city:
        maxLength: 100
        type: string
      country:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      name:
        maxLength: 200
        type: string
      province:
        type: string
      total_capacity:
        type: integer
      type:
        enum:
        - indoor
        - outdoor
        - hybrid
        type: string
    required:
    - address
    - city
    - name
    - total_capacity
    - type
    type: object
  venue.CreateVenueSectionRequest:
    properties:
      capacity:
        type: integer
      is_seated:
        type: boolean
      name:
        maxLength: 100
        type: string
    required:
    - capacity
    - name
    type: object
  venue.UpdateSeatRequest:
    properties:
      coord_x:
        type: number
      coord_y:
        type: number
      row_label:
        maxLength: 10
        type: string
      seat_number:
        maxLength: 10
        type: string
    type: object
  venue.UpdateVenueRequest:
    properties:
      address:
        type: string
      city:
        maxLength: 100
        type: string
      country:
        type: string
      latitude:
        maximum: 90
        minimum: -90
        type: number
      longitude:
        maximum: 180
        minimum: -180
        type: number
      name:
        maxLength: 200
        type: string
      province:
        type: string
      total_capacity:
        type: integer
      type:
        enum:
        - indoor
        - outdoor
        - hybrid
        type: string
    type: object
  venue.UpdateVenueSectionRequest:
    properties:
      capacity:
        type: integer
      is_seated:
        type: boolean
      name:
        maxLength: 100
        type: string
    type: object
info:
  contact: {}
  description: API for the Konsera ticketing platform
  title: Konsera API
  version: "1.0"
paths:
  /artists:
    post:
      consumes:
      - application/json
      parameters:
      - description: Artist
        in: body
        name: artist
        required: true
        schema:
          $ref: '#/definitions/event.CreateArtistRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Artist'
      security:
      - BearerAuth: []
      summary: Create artist
      tags:
      - Artists
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password, then return a JWT
        access token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Invalid request or credentials
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user with the provided information
      parameters:
      - description: User information
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Invalid request or email/phone already exists
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user
      tags:
      - Users
  /auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Resend the OTP code for user account activation
      parameters:
      - description: Resend OTP information
        in: body
        name: otp
        required: true
        schema:
          $ref: '#/definitions/dto.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP resent successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or failed to resend OTP
          schema:
            additionalProperties: true
            type: object
      summary: Resend OTP
      tags:
      - Users
  /auth/users/preferences:
    post:
      consumes:
      - application/json
      description: Create user preference for a specific user
      parameters:
      - description: User preference information
        in: body
        name: preference
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserPreferenceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User preference created successfully
          schema:
            $ref: '#/definitions/dto.UserPreferenceResponse'
        "400":
          description: Invalid request or failed to create user preference
          schema:
            additionalProperties: true
            type: object
      summary: Create User Preference
      tags:
      - Users
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP code for user account activation
      parameters:
      - description: OTP verification information
        in: body
        name: otp
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or OTP verification failed
          schema:
            additionalProperties: true
            type: object
      summary: Verify OTP
      tags:
      - Users
  /auth/verify-otp/{profile_id}/{code}:
    post:
      consumes:
      - application/json
      description: Verify the OTP code for user account activation using path parameters
      parameters:
      - description: Profile ID
        in: path
        name: profile_id
        required: true
        type: string
      - description: OTP Code
        in: path
        name: code
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or OTP verification failed
          schema:
            additionalProperties: true
            type: object
      summary: Verify OTP via Path Parameters
      tags:
      - Users
  /event-categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EventCategory'
            type: array
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - Event Categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/event.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EventCategory'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Event Categories
  /event-categories/{category_id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/helpers.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - Event Categories
    get:
      parameters:
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventCategory'
      security:
      - BearerAuth: []
      summary: Get category
      tags:
      - Event Categories
    put:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: category_id
        required: true
        type: string
      - description: Category changes
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/event.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EventCategory'
      security:
      - BearerAuth: []
      summary: Update category
      tags:
      - Event Categories
  /events:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Event'
            type: array
      security:
      - BearerAuth: []
      summary: List events
      tags:
      - Events
    post:
      consumes:
      - application/json
      parameters:
      - description: Event
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/event.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Event'
      security:
      - BearerAuth: []
      summary: Create event
      tags:
      - Events
  /events/{event_id}:
    delete:
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/helpers.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete event
      tags:
      - Events
    get:
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Event'
      security:
      - BearerAuth: []
      summary: Get event
      tags:
      - Events
    put:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      - description: Event changes
        in: body
        name: event
        required: true
        schema:
          $ref: '#/definitions/event.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Event'
      security:
      - BearerAuth: []
      summary: Update event
      tags:
      - Events
  /events/{event_id}/sessions:
    post:
      consumes:
      - application/json
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      - description: Session
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/event.CreateSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.EventSession'
      security:
      - BearerAuth: []
      summary: Create event session
      tags:
      - Event Sessions
  /events/{event_id}/ticket-tiers:
    get:
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
