definitions:
  konsera-backend_internal_DTO_user.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
      phone:
        type: string
    required:
    - email
    - full_name
    - password
    - phone
    type: object
  konsera-backend_internal_DTO_user.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  konsera-backend_internal_DTO_user.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/konsera-backend_internal_DTO_user.UserResponse'
    type: object
  konsera-backend_internal_DTO_user.ResendOTPRequest:
    properties:
      profile_id:
        type: string
    required:
    - profile_id
    type: object
  konsera-backend_internal_DTO_user.UserResponse:
    properties:
      auth_provider:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      phone:
        type: string
      profile_id:
        type: string
      provider_uid:
        type: string
      status:
        type: string
    type: object
  konsera-backend_internal_DTO_user.VerifyOTPRequest:
    properties:
      code:
        type: integer
      profile_id:
        type: string
    required:
    - code
    - profile_id
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password, then return a JWT
        access token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/konsera-backend_internal_DTO_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/konsera-backend_internal_DTO_user.LoginResponse'
        "400":
          description: Invalid request or credentials
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user with the provided information
      parameters:
      - description: User information
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/konsera-backend_internal_DTO_user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/konsera-backend_internal_DTO_user.UserResponse'
        "400":
          description: Invalid request or email/phone already exists
          schema:
            additionalProperties: true
            type: object
      summary: Create a new user
      tags:
      - Users
  /auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Resend the OTP code for user account activation
      parameters:
      - description: Resend OTP information
        in: body
        name: otp
        required: true
        schema:
          $ref: '#/definitions/konsera-backend_internal_DTO_user.ResendOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP resent successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or failed to resend OTP
          schema:
            additionalProperties: true
            type: object
      summary: Resend OTP
      tags:
      - Users
  /auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP code for user account activation
      parameters:
      - description: OTP verification information
        in: body
        name: otp
        required: true
        schema:
          $ref: '#/definitions/konsera-backend_internal_DTO_user.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or OTP verification failed
          schema:
            additionalProperties: true
            type: object
      summary: Verify OTP
      tags:
      - Users
  /auth/verify-otp/{profile_id}/{code}:
    post:
      consumes:
      - application/json
      description: Verify the OTP code for user account activation using path parameters
      parameters:
      - description: Profile ID
        in: path
        name: profile_id
        required: true
        type: string
      - description: OTP Code
        in: path
        name: code
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or OTP verification failed
          schema:
            additionalProperties: true
            type: object
      summary: Verify OTP via Path Parameters
      tags:
      - Users
swagger: "2.0"
